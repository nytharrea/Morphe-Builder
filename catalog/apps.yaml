      display_name: "Reddit-Adobo"

twitter:
  pkg: "com.twitter.android"
  display_name: "Twitter"
  arch: "arm64-v8a"
  icon: "https://cdn.simpleicons.org/x/000000"
  apk_source:
    type: apkmirror
    org: "x-corp"
    slug: "twitter"
    release_slug: "x"
  builds:
    - key: "twitter"
      patch_sources: ["piko"]
      exclude: ["Dynamic color"]
      enable: ["Bring back twitter", "Disunify xchat system", "Export all activities"]
    - key: "twitter-x"
      patch_sources: ["piko-newx", "morphe"]
      force_version: "12.29.1-prod.01"
      enable: ["Disable Play Store updates"]
      display_name: "Twitter-X"

instagram:
  pkg: "com.instagram.android"
  display_name: "Instagram"
  arch: "arm64-v8a"
  icon: "https://cdn.simpleicons.org/instagram/E4405F"
  apk_source:
    type: apkmirror
    org: "instagram"
    slug: "instagram"
  builds:
    - key: "instagram"
      patch_sources: ["piko"]
    - key: "instagram-hushgram"
      patch_sources: ["hushgram"]
      # HushGram is checked against exactly one Instagram build: version code 385511871, which APKMirror lists
      # as the arm64-v8a "480-640dpi" bundle of 449.0.0.52.84. Update this when HushGram moves to a newer Instagram.
      force_build: "385511871"
      display_name: "Instagram-HushGram"
      enable:
        - "Stop Story auto-advance"
        - "Tap to play"
        - "Turn off double tap to like"
        - "View stories anonymously"
        - "Don't send reel watch history"
        - "Clean up Reels"
        - "Default playback quality"
        - "Hide the Reels tab"
        - "Download any video"
        - "Hide Reels in the feed"

gboard:
  pkg: "com.google.android.inputmethod.latin"
