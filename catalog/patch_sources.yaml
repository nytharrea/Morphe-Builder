# Every patch bundle the pipeline can pull patches from.
#
# Each key is referenced from catalog/apps.yaml's `builds[].patch_sources`
# list. `owner`/`repo` point at the GitHub repo whose latest (pre)release
# ships a `.mpp` patch bundle; `label` is the emoji-prefixed name used in
# release notes and (when an app has more than one build sharing the same
# display name) to disambiguate the output filename.

morphe:
  owner: MorpheApp
  repo: morphe-patches
  label: "🟢 Morphe"

piko:
  owner: crimera
  repo: piko
  label: "✖️ Piko"

