name: Patch

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      release_name: ${{ steps.release.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install & freeze Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt
          pip freeze > requirements-lock.txt

      - name: Commit updated lockfile
        run: |
          if [ -n "$(git status --porcelain -- requirements-lock.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add requirements-lock.txt
            git commit -m "chore: update requirements-lock.txt [skip ci]"
            git push
          else
            echo "requirements-lock.txt unchanged, skipping commit."
          fi

      - name: Compute release tag
        id: release
        run: python prepare_release.py

  patch:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # FlareSolverr v3.5.2 servisi (Camoufox/Playwright yerine)
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
        env:
          LOG_LEVEL: info
          TZ: UTC
        ports:
          - 8191:8191

    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
      artifact-metadata: write

    strategy:
      fail-fast: false
      max-parallel: 30
      matrix:
        app:
          - youtube
          - youtube-music
          - reddit
          - reddit-adobo
          - twitter
          - twitter-x
          - instagram
          - gboard
          - speedtest
          - brave
          - proton-vpn
          - tiktok
          - tiktok-hxreborn
          - warp
          - inshot
          - google-photos
          - inure-github
          - inure-play
          - proton-pass
          - notesnook

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: true

      - name: Show runner IP
        run: curl -s --max-time 10 https://api.ipify.org || true

      - name: Jitter delay before browser starts
        run: |
          delay=$(( RANDOM % 25 ))
          echo "Sleeping ${delay}s to avoid every matrix job hitting APKMirror in the same instant"
          sleep "$delay"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: 25

      - name: Install Python dependencies (from lockfile, pinned versions)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Wait for FlareSolverr to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s -X POST http://localhost:8191/v1 \
                 -H 'Content-Type: application/json' \
                 -d '{"cmd":"sessions.list"}' | grep -q '"status":"ok"'; then
              echo "FlareSolverr is ready"
              exit 0
            fi
            echo "Waiting for FlareSolverr... ($i)"
            sleep 2
          done
          echo "FlareSolverr did not become ready" >&2
          exit 1

      - name: Setup Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > Panemi.keystore

      - name: Run script
        run: python -u main.py
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_APP: ${{ matrix.app }}
          KS_PATH: "Panemi.keystore"
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FLARESOLVERR_URL: "http://localhost:8191"

      - name: Upload patched APK artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: apk-${{ matrix.app }}
          path: dist/*.apk
          if-no-files-found: ignore
          retention-days: 1

      - name: Commit updated signature files
        if: always()
        run: python commit_signature.py "${{ matrix.app }}"

      - name: Generate build provenance attestation
        if: ${{ hashFiles('dist/*.apk') != '' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            dist/*.apk
            !dist/microg*.apk

  finalize:
    needs: [prepare, patch]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download patched APK artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: apk-*
          path: artifacts
          merge-multiple: true

      - name: Create release and clean up old releases
        run: python finalize_release.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
          ARTIFACTS_DIR: artifacts
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APPRISE_URLS: ${{ secrets.APPRISE_URLS }}

  cleanup:
    needs: finalize
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee
        with:
          retain_days: 0
          keep_minimum_runs: 1
