name: Patch

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    permissions:
      contents: read

    outputs:
      release_tag: ${{ steps.plan.outputs.tag }}
      release_name: ${{ steps.plan.outputs.name }}
      build_matrix: ${{ steps.plan.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          check-latest: true

      - name: Install Python dependencies (from lockfile, pinned versions)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Install morphe_builder package (editable, no dependency resolution)
        run: pip install -e . --no-deps

      - name: Validate catalog and compute release plan
        id: plan
        run: python scripts/prepare_release.py

      - name: Download shared patch assets (jar + every patch source's .mpp, once for the whole matrix)
        run: python scripts/download_shared_assets.py

      - name: Upload shared assets artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shared-patch-assets
          path: |
            *.jar
            *.mpp
          if-no-files-found: error
          retention-days: 1

  patch:
    needs: prepare
    runs-on: ubuntu-26.04
    timeout-minutes: 25

    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
      artifact-metadata: write

    strategy:
      fail-fast: false
      max-parallel: 30
      matrix:
        app: ${{ fromJson(needs.prepare.outputs.build_matrix) }}

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: info
        options: >-
          --health-cmd "curl -f http://localhost:8191/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 15s

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: true

      - name: Show runner IP
        run: curl -s --max-time 10 https://api.ipify.org || true

      - name: Jitter delay before hitting APKMirror
        run: |
          delay=$(( RANDOM % 25 ))
          echo "Sleeping ${delay}s to avoid every matrix job hitting APKMirror in the same instant"
          sleep "$delay"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          check-latest: true

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: 25
          check-latest: true

      - name: Install Python dependencies (from lockfile, pinned versions)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Install morphe_builder package (editable, no dependency resolution)
        run: pip install -e . --no-deps

      - name: Download shared patch assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: shared-patch-assets
          path: .
        continue-on-error: true # best-effort: a missing/expired artifact just means this job falls back to downloading its own copy, like before

      - name: Setup Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Run patch pipeline
        run: python -u scripts/patch.py
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_APP: ${{ matrix.app }}
          KS_PATH: "release.keystore"
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Show FlareSolverr logs
        if: failure()
        run: docker logs "$(docker ps -aq --filter ancestor=ghcr.io/flaresolverr/flaresolverr:latest)" 2>&1 | tail -200 || true

      - name: Upload patched APK artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: apk-${{ matrix.app }}
          path: |
            dist/*.apk
            dist/status-*.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnostics-${{ matrix.app }}-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit signature record if new
        if: always()
        run: python scripts/commit_signature.py "${{ matrix.app }}"

      - name: Generate build provenance attestation
        if: ${{ hashFiles('dist/*.apk') != '' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            dist/*.apk
            !dist/microg*.apk

  finalize:
    needs: [prepare, patch]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          check-latest: true

      - name: Install dependencies (from lockfile, pinned versions)
        run: pip install -r requirements-lock.txt

      - name: Install morphe_builder package (editable, no dependency resolution)
        run: pip install -e . --no-deps

      - name: Download patched APK artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: apk-*
          path: artifacts
          merge-multiple: true

      - name: Create release and clean up old releases
        run: python scripts/finalize_release.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
          ARTIFACTS_DIR: artifacts
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APPRISE_URLS: ${{ secrets.APPRISE_URLS }}

  cleanup:
    needs: finalize
    if: always()
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee
        with:
          retain_days: 30
          keep_minimum_runs: 5
