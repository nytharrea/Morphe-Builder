name: Morphe Patch Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  patch-apps:
    runs-on: ubuntu-latest
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: info
          TZ: Europe/Istanbul
        options: --name flaresolverr

    strategy:
      fail-fast: false
      matrix:
        app:
          - instagram
          - speedtest
          - youtube
          - youtube-music

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v7

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Java Ortamını Hazırla
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: FlareSolverr Servis Sağlığını Doğrula
        run: |
          curl -v --retry 5 --retry-connrefused --retry-delay 5 http://localhost:8191/

      - name: Uygulamayı İndir ve Yamala
        env:
          FLARESOLVERR_URL: "http://localhost:8191"
        run: |
          python main.py ${{ matrix.app }}

      - name: Üretilen APK'ları Arşivle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-patched
          path: build/${{ matrix.app }}/*.apk
