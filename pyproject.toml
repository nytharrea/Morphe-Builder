[project]
name = "morphe-builder"
version = "0.1.0"
description = "Android APK patching automation pipeline (scrape, patch, sign, release) driven by GitHub Actions"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 115
exclude = ["diagnostics", "downloads"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# scripts/*.py insert the repo root onto sys.path before importing
# morphe_builder (a sibling directory, not an installed package) - that
# statement has to run before those imports, which ruff's import-order
# check (E402) would otherwise flag.
"scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
check_untyped_defs = true
