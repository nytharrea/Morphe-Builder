[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "morphe-builder"
version = "0.1.0"
description = "Android APK patching automation pipeline (scrape, patch, sign, release) driven by GitHub Actions"
requires-python = ">=3.12"
dependencies = [
    "curl_cffi==0.16.3",
    "lxml==6.1.3",
    "tenacity==9.1.4",
    "loguru==0.7.3",
    "androguard==4.1.4",
    "cryptography==50.0.1",
    "apprise==1.13.1",
    "pydantic-settings==2.15.0",
    "PyYAML==6.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/morphe_builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 115
exclude = ["diagnostics", "downloads"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
check_untyped_defs = true
